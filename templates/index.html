<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 能力评估看板 — Phase 5 Full + LLM-as-Judge</title>
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; color: #1a1a2e; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; padding: 24px 32px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; font-weight: 600; }
        header .subtitle { font-size: 14px; opacity: 0.8; margin-top: 4px; }
        header .update-time { font-size: 12px; opacity: 0.6; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .card h2 { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #e8e8ef; }
        .card-full { grid-column: 1 / -1; }
        .card-trend { grid-column: 1 / -1; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e8e8ef; }
        td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
        .rank-badge { display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; font-weight: 700; font-size: 13px; }
        .rank-1 { background: #ffd700; color: #1a1a2e; }
        .rank-2 { background: #c0c0c0; color: #1a1a2e; }
        .rank-3 { background: #cd7f32; color: white; }
        .rank-other { background: #e8e8ef; color: #6b7280; }
        .agent-id { font-family: "SF Mono", Monaco, monospace; font-size: 13px; color: #2563eb; font-weight: 500; }
        .score-bar { display: flex; align-items: center; gap: 8px; }
        .score-fill { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.5s ease; }
        .score-text { font-weight: 600; min-width: 40px; text-align: right; }
        .chart-container { width: 100%; height: 400px; }
        .chart-container-sm { width: 100%; height: 350px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn { padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .tab-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tab-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .detail-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .detail-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
        .detail-item { font-size: 13px; }
        .detail-item .label { color: #6b7280; font-size: 11px; text-transform: uppercase; }
        .detail-item .value { font-weight: 600; font-size: 16px; color: #1a1a2e; }
        .loading { text-align: center; padding: 40px; color: #9ca3af; }
        .indicator { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .good { background: #d1fae5; color: #065f46; }
        .warn { background: #fef3c7; color: #92400e; }
        .bad { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📊 Agent 能力评估看板</h1>
                <div class="subtitle">Agent Capability Assessment Dashboard — Phase 5 Full + LLM-as-Judge</div>
                <div class="update-time" id="updateTime">加载中...</div>
            </div>
            <div style="font-size:13px;opacity:0.7;text-align:right;">
                <div>指标: TCR · FPSR · ART · TCD · RR</div>
                <div style="margin-top:2px;">LGS-156 · 评估看板 MVP</div>
            </div>
        </header>

        <!-- Section 1: Agent Ranking -->
        <div class="grid">
            <div class="card">
                <h2>🏆 Agent 排名</h2>
                <div id="rankingTable"><div class="loading">加载排名数据...</div></div>
            </div>
            <div class="card">
                <h2>📈 综合评分</h2>
                <div id="scoreChart"><div class="loading">加载评分数据...</div></div>
            </div>
        </div>

        <!-- Section 2: Trend Charts -->
        <div class="card card-full">
            <h2>📉 指标趋势</h2>
            <div class="tabs" id="trendTabs">
                <button class="tab-btn active" data-metric="tcr">TCR</button>
                <button class="tab-btn" data-metric="fpsr">FPSR</button>
                <button class="tab-btn" data-metric="art">ART (h)</button>
                <button class="tab-btn" data-metric="tcd">TCD (h)</button>
                <button class="tab-btn" data-metric="rr">RR</button>
            </div>
            <div id="trendChart" class="chart-container"><div class="loading">加载趋势数据...</div></div>
        </div>

        <!-- Section 3: Radar Chart -->
        <div class="grid">
            <div class="card">
                <h2>🎯 能力雷达图</h2>
                <p style="font-size:13px;color:#6b7280;margin-bottom:12px;">多维度能力对比 (0-100 归一化)</p>
                <div id="radarChart" class="chart-container-sm"><div class="loading">加载雷达数据...</div></div>
            </div>
            <div class="card">
                <h2>📊 维度摘要</h2>
                <div id="dimensionSummary"><div class="loading">加载维度数据...</div></div>
            </div>
        </div>

        <!-- Section 4: Detailed Records -->
        <div class="card card-full">
            <h2>📋 详细评估记录</h2>
            <div id="detailedRecords"><div class="loading">加载详细记录...</div></div>
        </div>
    </div>

    <script>
        // ── 数据加载 ──
        let rankingData = null;
        let trendData = null;
        let radarData = null;
        let detailData = null;

        async function loadAll() {
            try {
                const [ranking, trends, radar, details] = await Promise.all([
                    (await fetch("/api/ranking")).json(),
                    (await fetch("/api/trends")).json(),
                    (await fetch("/api/radar")).json(),
                    (await fetch("/api/details")).json(),
                ]);
                rankingData = ranking;
                trendData = trends;
                radarData = radar;
                detailData = details;

                if (ranking.generated_at) {
                    document.getElementById("updateTime").textContent = "更新于: " + new Date(ranking.generated_at).toLocaleString("zh-CN");
                }

                renderRanking(ranking.ranking);
                renderScoreChart(ranking.ranking);
                renderTrend("tcr");
                renderRadar(radar);
                renderDimensionSummary(radar);
                renderDetails(details.records);
            } catch (e) {
                console.error("Failed to load data:", e);
                document.querySelectorAll(".loading").forEach(el => el.textContent = "⚠️ 数据加载失败: " + e.message);
            }
        }

        // ── 排名渲染 ──
        function renderRanking(ranking) {
            if (!ranking || ranking.length === 0) {
                document.getElementById("rankingTable").innerHTML = '<p style="color:#9ca3af;text-align:center;">暂无排名数据</p>';
                return;
            }
            let html = `<table>
                <tr><th>#</th><th>Agent</th><th style="text-align:right;">综合分</th><th style="text-align:right;">TCR</th><th style="text-align:right;">FPSR</th><th style="text-align:right;">ART (h)</th><th style="text-align:right;">TCD (h)</th><th style="text-align:right;">RR</th></tr>`;
            ranking.forEach(r => {
                const rankClass = r.rank === 1 ? "rank-1" : r.rank === 2 ? "rank-2" : r.rank === 3 ? "rank-3" : "rank-other";
                const rrClass = r.rr <= 0.1 ? "good" : r.rr <= 0.3 ? "warn" : "bad";
                html += `<tr>
                    <td><span class="rank-badge ${rankClass}">${r.rank}</span></td>
                    <td class="agent-id">${r.agent_id.substring(0, 8)}...</td>
                    <td style="text-align:right;font-weight:700;">${r.composite_score.toFixed(1)}</td>
                    <td style="text-align:right;">${(r.tcr * 100).toFixed(0)}%</td>
                    <td style="text-align:right;">${(r.fpsr * 100).toFixed(0)}%</td>
                    <td style="text-align:right;">${r.art_hours.toFixed(2)}</td>
                    <td style="text-align:right;">${r.tcd_hours.toFixed(2)}</td>
                    <td style="text-align:right;"><span class="indicator ${rrClass}">${(r.rr * 100).toFixed(0)}%</span></td>
                </tr>`;
            });
            html += "</table>";
            document.getElementById("rankingTable").innerHTML = html;
        }

        function renderScoreChart(ranking) {
            if (!ranking || ranking.length === 0) return;
            const agents = ranking.map(r => r.agent_id.substring(0, 8) + "...");
            const scores = ranking.map(r => r.composite_score);
            const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444"];
            const data = [{
                type: "bar",
                x: agents,
                y: scores,
                marker: { color: colors.slice(0, agents.length) },
                text: scores.map(s => s.toFixed(1)),
                textposition: "outside",
                textfont: { size: 11 },
            }];
            const layout = {
                margin: { t: 10, b: 40, l: 10, r: 10 },
                yaxis: { title: "综合评分", range: [0, Math.max(...scores) * 1.2 || 100] },
                xaxis: { tickangle: -20 },
                paper_bgcolor: "rgba(0,0,0,0)",
                plot_bgcolor: "rgba(0,0,0,0)",
                font: { size: 11 },
                height: 260,
            };
            Plotly.newPlot("scoreChart", data, layout, { displayModeBar: false, responsive: true });
        }

        // ── 趋势渲染 ──
        function renderTrend(metric) {
            if (!trendData || !trendData.timestamps) return;
            const ts = trendData.timestamps;
            const agents = Object.keys(trendData[metric]);
            const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"];

            const traces = agents.map((agent, i) => {
                const label = agent.substring(0, 8) + "...";
                return {
                    type: "scatter",
                    mode: "lines+markers",
                    name: label,
                    x: ts,
                    y: trendData[metric][agent],
                    line: { color: colors[i % colors.length], width: 2 },
                    marker: { size: 6 },
                };
            });

            const metricNames = { tcr: "TCR (任务完成率)", fpsr: "FPSR (一次通过率)", art: "ART (平均响应时间 h)", tcd: "TCD (任务完成时长 h)", rr: "RR (返工率)" };
            const layout = {
                title: { text: metricNames[metric] || metric, font: { size: 14 } },
                margin: { t: 40, b: 40, l: 50, r: 20 },
                paper_bgcolor: "rgba(0,0,0,0)",
                plot_bgcolor: "rgba(0,0,0,0)",
                legend: { orientation: "h", y: -0.2 },
                font: { size: 11 },
                height: 320,
            };
            Plotly.newPlot("trendChart", traces, layout, { displayModeBar: false, responsive: true });
        }

        document.getElementById("trendTabs").addEventListener("click", function(e) {
            const btn = e.target.closest(".tab-btn");
            if (!btn) return;
            this.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTrend(btn.dataset.metric);
        });

        // ── 雷达图 ──
        function renderRadar(data) {
            if (!data || !data.agents || data.agents.length === 0) return;
            const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"];
            const traces = data.agents.map((agent, i) => {
                const label = agent.length > 8 ? agent.substring(0, 8) + "..." : agent;
                return {
                    type: "scatterpolar",
                    r: [...data.data[i], data.data[i][0]],
                    theta: [...data.dimensions, data.dimensions[0]],
                    fill: "toself",
                    name: label,
                    line: { color: colors[i % colors.length] },
                    opacity: 0.6,
                };
            });
            const layout = {
                polar: {
                    radialaxis: { range: [0, 100], tickfont: { size: 10 } }
                },
                paper_bgcolor: "rgba(0,0,0,0)",
                font: { size: 11 },
                margin: { t: 10, b: 20, l: 60, r: 60 },
                height: 300,
                legend: { orientation: "h", y: -0.1 },
            };
            Plotly.newPlot("radarChart", traces, layout, { displayModeBar: false, responsive: true });
        }

        function renderDimensionSummary(radar) {
            if (!radar || !radar.agents || radar.agents.length === 0) {
                document.getElementById("dimensionSummary").innerHTML = '<p style="color:#9ca3af;text-align:center;">暂无维度数据</p>';
                return;
            }
            let html = "<table><tr><th>维度</th>";
            radar.agents.forEach(a => {
                const label = a.length > 8 ? a.substring(0, 8) + "..." : a;
                html += `<th style="text-align:right;">${label}</th>`;
            });
            html += "</tr>";
            radar.dimensions.forEach((dim, di) => {
                html += `<tr><td style="font-weight:500;">${dim}</td>`;
                radar.agents.forEach((_, ai) => {
                    const val = radar.data[ai][di];
                    const color = val >= 70 ? "#065f46" : val >= 40 ? "#92400e" : "#991b1b";
                    html += `<td style="text-align:right;color:${color};font-weight:600;">${val}</td>`;
                });
                html += "</tr>";
            });
            html += "</table>";
            document.getElementById("dimensionSummary").innerHTML = html;
        }

        // ── 详细记录 ──
        function renderDetails(records) {
            if (!records || records.length === 0) {
                document.getElementById("detailedRecords").innerHTML = '<p style="color:#9ca3af;text-align:center;">暂无详细记录</p>';
                return;
            }
            let html = "";
            records.forEach(r => {
                const rrClass = r.rr <= 0.1 ? "good" : r.rr <= 0.3 ? "warn" : "bad";
                html += `<div class="detail-card">
                    <h3><span class="agent-id">${r.agent_id}</span></h3>
                    <div class="detail-grid">
                        <div class="detail-item"><div class="label">TCR</div><div class="value">${(r.tcr * 100).toFixed(0)}%</div></div>
                        <div class="detail-item"><div class="label">FPSR</div><div class="value">${(r.fpsr * 100).toFixed(0)}%</div></div>
                        <div class="detail-item"><div class="label">ART</div><div class="value">${r.art_hours.toFixed(2)}h</div></div>
                        <div class="detail-item"><div class="label">TCD</div><div class="value">${r.tcd_hours.toFixed(2)}h</div></div>
                        <div class="detail-item"><div class="label">RR</div><div class="value"><span class="indicator ${rrClass}">${(r.rr * 100).toFixed(0)}%</span></div></div>
                        <div class="detail-item"><div class="label">任务总数</div><div class="value">${r.details?.tasks_total || '-'}</div></div>
                        <div class="detail-item"><div class="label">已完成</div><div class="value">${r.details?.tasks_completed || '-'}</div></div>
                        <div class="detail-item"><div class="label">一次通过</div><div class="value">${r.details?.first_pass_success || '-'}</div></div>
                    </div>
                </div>`;
            });
            document.getElementById("detailedRecords").innerHTML = html;
        }

        // ── 启动 ──
        loadAll();
    </script>
</body>
</html>
